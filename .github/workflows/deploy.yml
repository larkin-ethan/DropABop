name: Deploy

# Roadmap P11.2 (spec §35). On every push to main: checks → deploy dev → publish the dev website. Prod waits for
# Ethan's approval (GitHub Environment "production" with him as required reviewer), then deploys the same commit.
#
# AWS access is by OpenID Connect: no keys are stored in GitHub. One-time setup (P11.3, DEPLOYMENT.md §6):
#   repository variables AWS_DEPLOY_ROLE_ARN and AWS_CLOUDFORMATION_ROLE_ARN (outputs of infra/bootstrap.yaml),
#   secret ALERT_EMAIL (prod alarm/budget emails; not stored in the repo, which is public).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets the job ask GitHub for the OIDC token AWS checks

concurrency:
  group: deploy # one deploy at a time; a newer push waits rather than racing
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  SAM_CLI_TELEMETRY: '0'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify (format, lint, typecheck, unit tests, guardrails)
        run: npm run verify

  deploy-dev:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: dropabop-deploy-dev
      - name: Build
        working-directory: infra
        run: sam build --config-env dev
      - name: Deploy the dev stack
        working-directory: infra
        run: >
          sam deploy --config-env dev
          --no-confirm-changeset --no-fail-on-empty-changeset
          --role-arn "${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}"
      - name: Publish the dev website
        run: bash scripts/deploy-web.sh
        env:
          STACK: dropabop-dev
          AWS_PROFILE_NAME: ''

  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production # pauses here until Ethan approves in GitHub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: dropabop-deploy-prod
      - name: Build
        working-directory: infra
        run: sam build --config-env prod
      - name: Deploy the prod stack
        working-directory: infra
        # Command-line overrides replace samconfig's, so the prod settings are repeated here with the alert email.
        run: >
          sam deploy --config-env prod
          --no-confirm-changeset --no-fail-on-empty-changeset
          --role-arn "${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}"
          --parameter-overrides "Stage=prod AlertEmail=${{ secrets.ALERT_EMAIL }}"
      - name: Publish the prod website
        run: bash scripts/deploy-web.sh
        env:
          STACK: dropabop-prod
          AWS_PROFILE_NAME: ''
