name: CI

# Runs the same checks as `npm run verify` locally: format, lint, typecheck, unit tests, guardrails.
# Integration tests (DynamoDB Local) and deploys get their own jobs in later phases.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Fast, dependency-free cost and security rules. Runs first so violations are reported even if the build breaks.
      - name: Guardrails
        run: bash scripts/guardrails.sh

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify (format, lint, typecheck, unit tests, guardrails)
        run: npm run verify
