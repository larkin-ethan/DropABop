name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Always runs, even before the app exists: cost and security rules from the spec.
      - name: Guardrails
        run: bash scripts/guardrails.sh

      # The steps below activate once Phase 1 (P1.1) creates package.json and .nvmrc.
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Lint, typecheck, unit tests
        if: hashFiles('package.json') != ''
        run: npm run verify
