# Drop a Bop — GitHub → AWS deploy access (roadmap P11.1, spec §35). Deployed ONCE per AWS account, by hand, by Ethan
# (P11.3; DEPLOYMENT.md §6). No long-lived access keys: GitHub proves who it is with a short-lived OpenID Connect
# token for each run, and AWS hands back temporary credentials only to this repository's main branch (dev) or its
# approved "production" environment (prod).
#
# Two roles, least privilege (spec §31):
# - GitHubDeployRole: what the workflow may do directly: run CloudFormation change sets on the dropabop stacks, upload
#   build files, publish the website, and clear CloudFront's cache. It cannot create resources itself.
# - CloudFormationExecutionRole: what CloudFormation may do while applying the app template (infra/template.yaml):
#   only the resource types that template uses, only on resources named dropabop-*.

AWSTemplateFormatVersion: '2010-09-09'
Description: Drop a Bop - GitHub Actions deploy roles (OIDC, no access keys)

Parameters:
  GitHubRepo:
    Type: String
    AllowedPattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
    Description: 'The GitHub repository allowed to deploy, as owner/name (e.g. ethan/drop-a-bop).'
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: "An account can have GitHub's identity provider only once. Use false if it already exists."

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dropabop-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Only pushes to main (dev deploys) and the approved "production" environment (prod deploys).
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubRepo}:ref:refs/heads/main'
                  - !Sub 'repo:${GitHubRepo}:environment:production'
      Policies:
        - PolicyName: deploy-dropabop
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: RunChangeSetsOnOurStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/dropabop-dev/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/dropabop-prod/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31'
              - Sid: HandChangesToCloudFormationRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: UploadBuildFiles
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:ListBucket, s3:GetBucketLocation]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-samclisourcebucket-*'
                  - !Sub 'arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/*'
              - Sid: PublishWebsite
                Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject, s3:ListBucket]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::dropabop-*-webbucket-*'
                  - !Sub 'arn:${AWS::Partition}:s3:::dropabop-*-webbucket-*/*'
              - Sid: ClearWebsiteCache
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*'

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dropabop-cloudformation
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: manage-dropabop-resources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Database
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:UpdateTable
                  - dynamodb:DescribeTable
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:UpdateTimeToLive
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:UpdateContinuousBackups
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                  - dynamodb:ListTagsOfResource
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/dropabop-*'
              - Sid: Functions
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:GetRuntimeManagementConfig
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:GetPolicy
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:ListTags
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:dropabop-*'
              - Sid: FunctionCodeFromSamBucket
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/*'
              - Sid: FunctionRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                # Only the app stacks' own function roles, never these deploy roles (no editing your own permissions).
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/dropabop-dev-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/dropabop-prod-*'
              - Sid: GiveFunctionsTheirRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/dropabop-dev-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/dropabop-prod-*'
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: Api
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE # tags go through POST/PUT/DELETE on /tags too
                Resource:
                  - !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis'
                  - !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/*'
                  - !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/tags/*'
              - Sid: SignIn
                Effect: Allow
                Action:
                  - cognito-idp:CreateUserPool
                  - cognito-idp:UpdateUserPool
                  - cognito-idp:DescribeUserPool
                  - cognito-idp:GetUserPoolMfaConfig
                  - cognito-idp:SetUserPoolMfaConfig
                  - cognito-idp:CreateUserPoolClient
                  - cognito-idp:UpdateUserPoolClient
                  - cognito-idp:DescribeUserPoolClient
                  - cognito-idp:DeleteUserPoolClient
                  - cognito-idp:TagResource
                  - cognito-idp:UntagResource
                  - cognito-idp:ListTagsForResource
                Resource: !Sub 'arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:DescribeLogGroups
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsForResource
                  # API Gateway access logs are delivered through these.
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                Resource: '*'
              - Sid: Alerts
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                  - cloudwatch:ListTagsForResource
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:GetTopicAttributes
                  - sns:SetTopicAttributes
                  - sns:Subscribe
                  - sns:Unsubscribe
                  - sns:GetSubscriptionAttributes
                  - sns:ListSubscriptionsByTopic
                  - sns:TagResource
                  - sns:UntagResource
                  - sns:ListTagsForResource
                  - budgets:ModifyBudget
                  - budgets:ViewBudget
                Resource: '*'
              - Sid: Website
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:PutBucketPolicy
                  - s3:GetBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutBucketOwnershipControls
                  - s3:GetBucketOwnershipControls
                  - s3:PutEncryptionConfiguration
                  - s3:GetEncryptionConfiguration
                  - s3:PutBucketTagging
                  - s3:GetBucketTagging
                  - s3:GetBucketLocation
                Resource: !Sub 'arn:${AWS::Partition}:s3:::dropabop-*'
              - Sid: WebsiteCdn
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:UpdateDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:DeleteDistribution
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:ListTagsForResource
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:CreateResponseHeadersPolicy
                  - cloudfront:GetResponseHeadersPolicy
                  - cloudfront:UpdateResponseHeadersPolicy
                  - cloudfront:DeleteResponseHeadersPolicy
                Resource: '*'

Outputs:
  DeployRoleArn:
    Description: Put this in the GitHub repository variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubDeployRole.Arn
  CloudFormationRoleArn:
    Description: Put this in the GitHub repository variable AWS_CLOUDFORMATION_ROLE_ARN
    Value: !GetAtt CloudFormationExecutionRole.Arn
