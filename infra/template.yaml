            ApiId: !Ref HttpApi
            Method: POST
            Path: /songs/resolve

  # ---------------------------------------------------------------------------------------------------------------
  # Alerts (spec §7, §33; roadmap P4.4). Email when something is failing or the bill moves. Alarms stay quiet when
  # there's no traffic (missing data = OK). Costs: 4 alarm metrics per stage, inside CloudWatch's 10 free; the budget
  # is free (email-only budgets cost nothing). Prices checked 2026-10-03 (DEPLOYMENT.md §4).
  # ---------------------------------------------------------------------------------------------------------------
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub dropabop-${Stage}-alerts
      DisplayName: !Sub Drop a Bop (${Stage}) alerts

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email # AWS emails a confirmation link first; nothing arrives until it's clicked
      Endpoint: !Ref AlertEmail

  # Lambda's own Errors metric counts crashes our handler wrapper couldn't turn into a response (e.g. a function
  # failing at startup, as in P4.3). Handled errors become HTTP 500s and are caught by ApiServerErrorsAlarm below.
  # No dimension = every function in this account and region, which in a project account is just this app.
  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub dropabop-${Stage}-lambda-errors
      AlarmDescription: API functions crashed 5+ times in 5 minutes. Check the /dropabop/<stage>/api log group.
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  ApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub dropabop-${Stage}-api-5xx
      AlarmDescription: The API answered with a server error (5xx) 5+ times in 5 minutes.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
        - Name: Stage
          Value: $default
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # Any throttling means users saw errors, e.g. the table hit its on-demand caps (ADR-0005; the stats page is the
  # likeliest cause as history grows).
  TableReadThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub dropabop-${Stage}-dynamodb-read-throttles
      AlarmDescription: Database reads were throttled. Consider raising MaxReadRequestUnits (ADR-0005).
      Namespace: AWS/DynamoDB
      MetricName: ReadThrottleEvents
      Dimensions:
        - Name: TableName
          Value: !Ref Table
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  TableWriteThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub dropabop-${Stage}-dynamodb-write-throttles
      AlarmDescription: Database writes were throttled. Consider raising MaxWriteRequestUnits (ADR-0005).
      Namespace: AWS/DynamoDB
      MetricName: WriteThrottleEvents
      Dimensions:
        - Name: TableName
          Value: !Ref Table
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # The account-wide safety net from P4.1 (Ethan's project also has a $20 spend limit). Emails directly, so it
  # works even if the SNS subscription was never confirmed.
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: ShouldCreateBudget
    Properties:
      Budget:
        BudgetName: dropabop-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 5
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

  # ---------------------------------------------------------------------------------------------------------------
  # Website hosting (spec §3, roadmap P9.2): the built React app in a private S3 bucket, served only through
  # CloudFront over HTTPS. Nobody can read the bucket directly (Origin Access Control signs CloudFront's requests).
  # Cost: CloudFront's always-free 1 TB and 10 million requests a month; S3 holds a few MB (fractions of a cent).
  # ---------------------------------------------------------------------------------------------------------------
  WebBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldHostWebsite
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced # no ACLs at all; access is only by policy
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: app
          Value: dropabop

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: ShouldHostWebsite
    Properties:
      OriginAccessControlConfig:
        Name: !Sub dropabop-${Stage}-web
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Only this distribution may read the files, and only read (spec §31: least privilege).
  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: ShouldHostWebsite
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontReadsTheSite
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}'
          # Refuse any request that isn't over HTTPS (the actions this bucket ever sees: read, upload, delete, list).
          - Sid: HttpsOnly
            Effect: Deny
            Principal: '*'
            Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket]
            Resource:
              - !GetAtt WebBucket.Arn
              - !Sub '${WebBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # Security headers on every response (spec §31). The CSP lets the page load only its own files, album art from
  # Apple's image server, and talk only to Cognito and API Gateway in this region. (The API's exact address can't
  # be named here without a circular reference: the API's CORS names this site.)
  WebSecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Condition: ShouldHostWebsite
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub dropabop-${Stage}-security-headers
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000 # 2 years
            IncludeSubdomains: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub >-
              default-src 'self';
              script-src 'self';
              style-src 'self' 'unsafe-inline';
              img-src 'self' data: https://*.mzstatic.com;
              connect-src 'self' https://cognito-idp.${AWS::Region}.amazonaws.com https://*.execute-api.${AWS::Region}.amazonaws.com;
              font-src 'self';
              object-src 'none';
              base-uri 'self';
              form-action 'self';
              frame-ancestors 'none'

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: ShouldHostWebsite
    Properties:
      DistributionConfig:
        Comment: !Sub Drop a Bop website (${Stage})
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100 # North America and Europe edges only: the cheapest option
        DefaultRootObject: index.html
        Origins:
          - Id: website
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: '' # not used: Origin Access Control replaces it
        DefaultCacheBehavior:
          TargetOriginId: website
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # AWS managed "CachingOptimized" policy. index.html is uploaded with no-cache, so new releases show at once.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref WebSecurityHeaders
        # A single-page app: links like /join/SONG-7K4P aren't files, so S3 answers 403; serve the app instead and
        # let it show the right screen.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

Outputs:
  # Public values for the website's environment file (apps/web/.env.example). None of these are secrets.
  ApiUrl:
    Description: VITE_API_URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  UserPoolId:
    Description: VITE_COGNITO_USER_POOL_ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: VITE_COGNITO_CLIENT_ID
    Value: !Ref WebClient
  Region:
    Description: VITE_AWS_REGION
    Value: !Ref AWS::Region
  WebsiteUrl:
    Condition: ShouldHostWebsite
    Description: The website (CloudFront)
    Value: !Sub https://${WebDistribution.DomainName}
  ExternalWebsiteUrl:
    Condition: HasExternalSite
    Description: The website on the temporary external host (Cloudflare Pages, ADR-0010); scripts/deploy-web.sh publishes there
    Value: !Ref ExternalSiteOrigin
  WebBucketName:
    Condition: ShouldHostWebsite
    Description: Where scripts/deploy-web.sh uploads the built website
    Value: !Ref WebBucket
  WebDistributionId:
    Condition: ShouldHostWebsite
    Description: For clearing CloudFront's cache after a release
    Value: !Ref WebDistribution
  TableName:
    Description: The DynamoDB table (for the AWS console; the API reads it from TABLE_NAME)
    Value: !Ref Table
