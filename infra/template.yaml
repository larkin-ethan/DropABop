Outputs:
  # Public values for the website's environment file (apps/web/.env.example). None of these are secrets.
  ApiUrl:
    Description: VITE_API_URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  UserPoolId:
    Description: VITE_COGNITO_USER_POOL_ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: VITE_COGNITO_CLIENT_ID
    Value: !Ref WebClient
  Region:
    Description: VITE_AWS_REGION
    Value: !Ref AWS::Region
  TableName:
    Description: The DynamoDB table (for the AWS console; the API reads it from TABLE_NAME)
    Value: !Ref Table
