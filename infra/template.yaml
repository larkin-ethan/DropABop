          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /parties/{partyId}/join

  RegenerateInviteFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: index.regenerateInviteHandler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
