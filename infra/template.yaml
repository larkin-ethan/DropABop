          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: DELETE
            Path: /parties/{partyId}/members/{memberId}

  UpdateSettingsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: index.updateSettingsHandler
      Policies:
        - Statement:
            - Effect: Allow
