# Drop a Bop — application stack (ADR-0002). One copy per stage: dropabop-dev and dropabop-prod (infra/samconfig.toml).
#
# What's here: the DynamoDB table, the Cognito user pool + web app client, the HTTP API with a JWT authorizer, and one
# Lambda function per API route. Everything is pay-per-use; nothing bills while idle (spec §2, docs/ARCHITECTURE.md).
#
# Build and deploy (docs/DEPLOYMENT.md), from the infra/ folder:
#   sam build --config-env dev && sam deploy --config-env dev --profile dropabop-dev

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Drop a Bop (API, auth, database)

Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, prod]
    Description: Which copy of the app this stack is. Prod turns on backups and deletion protection.
  FrontendOrigin:
    Type: String
    # One origin, no path or trailing slash, e.g. http://localhost:5173 or https://d111111abcdef8.cloudfront.net
    AllowedPattern: '^https?://[a-zA-Z0-9.-]+(:[0-9]+)?$'
    Description: The website's origin. The only origin browsers may call the API from (CORS).
    # Prod must use the https CloudFront origin (P9.2). CloudFormation Rules can't check a prefix, so this is a
    # review item rather than an automatic check.

  AlertEmail:
    Type: String
    # Where alarm and budget emails go. Not stored in samconfig.toml (the repo is public): pass it once with
    # --parameter-overrides; later deploys reuse the stack's previous value (docs/DEPLOYMENT.md §4a).
    NoEcho: true
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: must be an email address
    Description: Email address for alarms and the monthly budget alert.
  CreateBudget:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    # A budget covers the whole AWS account, so only one stack per account should create it.
    Description: Create the account's $5/month budget alert in this stack.

Conditions:
  IsProd: !Equals [!Ref Stage, prod]
  ShouldCreateBudget: !Equals [!Ref CreateBudget, 'true']

Globals:
  Function:
    Runtime: nodejs24.x # newest GA Node.js runtime (checked 2026-10-01); local Node is 24 too
    Architectures: [arm64] # cheaper per millisecond than x86 for the same work
    MemorySize: 256
    Timeout: 10 # iTunes calls give up after 5 s (providers/itunes.ts); DynamoDB calls take milliseconds
    # Every function ships the same bundle (services/api/src/lambda.ts, built by services/api/Makefile).
    CodeUri: ../services/api
    LoggingConfig:
      LogGroup: !Ref ApiLogGroup # one log group for the whole API, with a retention limit
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        NODE_OPTIONS: --enable-source-maps # stack traces point at the TypeScript source

Resources:
  # ---------------------------------------------------------------------------------------------------------------
  # Database (docs/DATABASE.md, ADR-0005). Single table, no secondary indexes, on-demand with throughput caps.
  # ---------------------------------------------------------------------------------------------------------------
  Table:
    Type: AWS::DynamoDB::Table
    # Keep the data even if the stack is deleted or the table would be replaced. Deleting data is a human decision.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      # Must match TABLE_KEY_SCHEMA in services/api/src/data/table-definition.ts (a unit test checks this).
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      # Per-second ceilings far above real use, so a runaway bug is throttled instead of billed (ADR-0005).
      OnDemandThroughput:
        MaxReadRequestUnits: !If [IsProd, 100, 50]
        MaxWriteRequestUnits: !If [IsProd, 50, 25]
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      DeletionProtectionEnabled: !If [IsProd, true, false]
      Tags:
        - Key: app
          Value: dropabop

  # ---------------------------------------------------------------------------------------------------------------
  # Sign-in (spec §9, ADR-0008). Email + password only (D23). The website signs in with SRP through Amplify.
  # ---------------------------------------------------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain # accounts survive a deleted stack; removing them is a human decision
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub dropabop-${Stage}
      # Essentials is the default plan: 10,000 monthly active users free (aws.amazon.com/cognito/pricing, 2026-10-02).
      UserPoolTier: ESSENTIALS
      UsernameAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false # Sam@Example.com and sam@example.com are the same person
      AutoVerifiedAttributes: [email]
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false # people sign themselves up; parties are invite-only (spec §26)
      MfaConfiguration: 'OFF'
      # Same rules the sign-up form shows (apps/web/src/screens/AuthScreens.tsx).
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your Drop a Bop code
        EmailMessage: 'Your Drop a Bop verification code is {####}'
      # Uses Cognito's built-in email sender (no extra service). Its daily sending limit is plenty for one group.
      DeletionProtection: !If [IsProd, ACTIVE, INACTIVE]

  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub dropabop-${Stage}-web
      GenerateSecret: false # a website can't keep a secret (spec §9)
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH # the password itself is never sent
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED # don't reveal whether an email has an account
      EnableTokenRevocation: true # signing out revokes the refresh token
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # ---------------------------------------------------------------------------------------------------------------
  # HTTP API (spec §3). Every route needs a valid Cognito *access* token.
  # ---------------------------------------------------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: CognitoAccessToken
        Authorizers:
          CognitoAccessToken:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              # Access tokens carry no `aud`, so API Gateway checks their `client_id` against this list.
              audience:
                - !Ref WebClient
            # Only access tokens from sign-in carry this scope; ID tokens have no scope, so they're refused here.
            # Handlers also require token_use = access (services/api/src/http/request.ts).
            # Docs checked 2026-10-02: docs.aws.amazon.com/apigateway/latest/developerguide/http-api-jwt-authorizer.html
            # and docs.aws.amazon.com/cognito/latest/developerguide/amazon-cognito-user-pools-using-the-access-token.html
            AuthorizationScopes:
              - aws.cognito.signin.user.admin
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowMethods: [GET, POST, PUT, PATCH, DELETE]
        AllowHeaders: [authorization, content-type]
        MaxAge: 600
      # Rate limits (spec §32, roadmap P9.1). API Gateway counts each route's requests from ALL callers together
      # (token bucket: RateLimit per second, Burst = short spikes) and answers 429 above them; there's no per-person
      # limit in HTTP APIs. So limits leave room for a whole party at once (20 people) while capping abuse and cost.
      # Per-person limits come from the app's own rules (5 parties each, one song a day, invite codes required).
      # Docs checked 2026-10-04: docs.aws.amazon.com/apigateway/latest/developerguide/http-api-throttling.html
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
      RouteSettings:
        # Song search calls iTunes (about 20 calls a minute allowed; ADR-0007). Typing is debounced in the app.
        'GET /songs/search':
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 3
        'POST /songs/resolve':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
        # Invite codes: slow down anyone trying to guess codes (31^4 ≈ 920,000 possible).
        'GET /invites/{code}':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
        'POST /parties/{partyId}/join':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
        'POST /parties':
          ThrottlingBurstLimit: 3
          ThrottlingRateLimit: 1
        'POST /parties/{partyId}/invite-code':
          ThrottlingBurstLimit: 3
          ThrottlingRateLimit: 1
        'PATCH /parties/{partyId}/settings':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
        'DELETE /parties/{partyId}/members/{memberId}':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
        'PATCH /users/me':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
        'POST /rounds/{roundId}/recommendations':
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 5
        # Ratings: a whole party may be tapping at once on Sunday evening.
        'PUT /rounds/{roundId}/votes/{recommendationId}':
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /dropabop/${Stage}/api
      RetentionInDays: !If [IsProd, 30, 14] # for debugging recent problems; older logs only cost storage

  # ---------------------------------------------------------------------------------------------------------------
  # One function per route (docs/API.md). Each may use only the table actions its handler needs: never Scan
  # (spec §25), and Delete only where something is actually deleted. Transactions are authorized through the
  # actions of the items inside them (Put/Update/Delete), so there's no separate permission for them.
  # ---------------------------------------------------------------------------------------------------------------
  # Proves the API and authorizer work.
  HealthFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: index.healthHandler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /health

  # Creates the profile on first call.
  GetMeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: index.getMeHandler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:PutItem
              Resource: !GetAtt Table.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /users/me

  UpdateMeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: index.updateMeHandler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt Table.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: PATCH
            Path: /users/me

  CreatePartyFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: index.createPartyHandler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:PutItem
              Resource: !GetAtt Table.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /parties

  ListPartiesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: index.listPartiesHandler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource: !GetAtt Table.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /parties

  GetPartyFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: index.getPartyHandler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource: !GetAtt Table.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /parties/{partyId}

  PreviewInviteFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: index.previewInviteHandler
      Policies:
