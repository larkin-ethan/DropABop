            ApiId: !Ref HttpApi
            Method: GET
            Path: /parties/{partyId}/leaderboard

  # iTunes only; no database access.
  SearchSongsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: index.searchSongsHandler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /songs/search

  # iTunes only; no database access.
  ResolveSongFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
