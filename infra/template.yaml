      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: PUT
            Path: /rounds/{roundId}/votes/{recommendationId}

  ListMyVotesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
